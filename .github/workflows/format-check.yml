name: format-check
# Reusable workflow: validates that a PR or issue conforms to Crystal
# governance via GitHub Copilot CLI (auto routing by default).
# Posts a sticky comment with findings.
#
# Called from each Crystal repo:
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#     issues:
#       types: [opened, edited]
#   jobs:
#     check:
#       uses: Malakof/.github/.github/workflows/format-check.yml@vX.Y.Z
#       # Replace vX.Y.Z with the published release containing this migration.
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         copilot-requests: write

on:
  workflow_call:
    inputs:
      blocking:
        description: "Controls valid format rejections; unavailable review always fails."
        required: false
        default: false
        type: boolean
      model:
        description: "Copilot model ID or auto. Legacy openai/gpt-4o and openai/gpt-4o-mini map to auto."
        required: false
        default: "auto"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      copilot-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve governance pin
        id: pin
        run: |
          if [ -f ".crystal-governance.yaml" ]; then
            VERSION=$(grep '^governance_version:' .crystal-governance.yaml | sed 's/governance_version: *//' | tr -d '"' | xargs)
            echo "version=${VERSION:-main}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout governance at pin
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: Malakof/.github
          path: .governance
          ref: ${{ steps.pin.outputs.version }}

      - name: Install Python dependencies
        run: python3 -m pip install "PyYAML>=6.0"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned Copilot CLI
        run: npm install --global @github/copilot@1.0.112

      - name: Run format check (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORMAT_MODEL: ${{ inputs.model }}
          FORMAT_BLOCKING: ${{ inputs.blocking }}
        run: |
          python3 .governance/scripts/format_check.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --governance-root .governance \
            --model "$FORMAT_MODEL" \
            --blocking "$FORMAT_BLOCKING"

      - name: Run format check (issue)
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORMAT_MODEL: ${{ inputs.model }}
          FORMAT_BLOCKING: ${{ inputs.blocking }}
        run: |
          python3 .governance/scripts/format_check.py \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}" \
            --governance-root .governance \
            --model "$FORMAT_MODEL" \
            --blocking "$FORMAT_BLOCKING"
